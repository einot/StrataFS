\* CommitProtocol_NoRootProbeNoETag: MustFail, NoSelfDivergence.
\* Removes RootProbe (ADR 0022) from CommitProtocol_SwapNoETag: issue #103
\* without its fix. A swap takes effect and answers 200 with no ETag header,
\* commitLocked stores the empty ETag on its success path as it does at
\* edcfc15, so the mount's next swap is If-None-Match against a root pointer
\* that exists, fails, and diverges the mount with no other writer.
\* As a MustFail configuration it checks TypeOK and NoSelfDivergence only
\* (ADR 0013 section 7; docs/tla/README.md), so unlike the other three
\* NoRootProbe configurations, whose parents are flipped configurations
\* that kept two invariants, it differs from its parent in its invariants
\* as well as in the member. Its Fixes are its parent's less RootProbe; it
\* gained the three members marked inert below with its parent on
\* 2026-10-28 (ADR 0022 Assumption 31).
\* Expected route: Mutate, PutSnapshot [2,1], SwapNoETag, Mutate,
\* PutSnapshot [3,2], SwapConflict.
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
\*   PruneBelowCurrent: ADR 0019 section 2, the fix for #88 (no pass runs
\*     here, since Retention is 0)
\*   AtomicLoad: ADR 0020 section 2, the fix for #89 (never reached: Start
\*     is "Loaded" and MaxCrashes 0, so no mount loads)
\*   FallbackOptIn: ADR 0021 section 2, the fix for #91 (never reached, since
\*     the backend honours every conditional write)
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence", "PruneBelowCurrent", "AtomicLoad", "FallbackOptIn"}
  Capability = "Conditional"
  Faults = {"SwapNoETag"}
  Start = "Loaded"
  Retention = 0
  MaxEpoch = 3
  Nonces = {1, 2}
  MaxCrashes = 0
INVARIANTS
  TypeOK
  NoSelfDivergence
CHECK_DEADLOCK FALSE

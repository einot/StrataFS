\* CommitProtocol_RootBeforeSnapshot: MustFail, RootSnapshotExists.
\* Removes ChunksFirst (ADR 0012 section 2; in the code since 247ef90, and
\* 3deecf1 changed flushAll) from CommitProtocol, so a commit runs its swap,
\* then its snapshot Put, then its flush (Assumption J7): the root pointer
\* names a snapshot the bucket does not hold yet.
\* Expected route: InitEmpty, then SwapOK, before the snapshot is put.
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ReadOnlyFence: ADR 0011 section 3
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ReadOnlyFence"}
  Capability = "Conditional"
  Faults = {"SwapFailed", "PutFailed"}
  Start = "Empty"
  Retention = 0
  MaxEpoch = 3
  Nonces = {1, 2}
  MaxCrashes = 1
INVARIANTS
  TypeOK
  RootSnapshotExists
CHECK_DEADLOCK FALSE

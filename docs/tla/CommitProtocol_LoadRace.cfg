\* CommitProtocol_LoadRace: MustHold.
\* Issue #89: loadOrInit took the root pointer's ETag (HeadRoot) after
\* another writer's swap, so the mount paired an older snapshot with the
\* newer ETag, and its next swap won against a root it never loaded. Flipped
\* to MustHold by ADR 0020, which added AtomicLoad to Fixes: GetRoot takes
\* the key and the ETag from one read, so B's swap carries the ETag of the
\* root pointer it loaded, fails its condition once A has moved it, and B
\* diverges with A's commit intact. CommitProtocol_NoAtomicLoad is this
\* configuration without the member.
\* Route it showed before the flip, as TLC reported it at 55fc666: A inits
\* [1,1]; B runs GetRoot; A runs Mutate, PutSnapshot [2,1] and SwapOK; B runs
\* HeadRoot, which takes A's ETag, GetSnapshot, which loads A's epoch-1
\* commit only, Mutate, PutSnapshot [2,2] and SwapOK. A's epoch-2 commit is
\* no longer in the root pointer's snapshot.
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
\*   AtomicLoad: ADR 0020 section 2, the fix for #89
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A", "B"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence", "AtomicLoad"}
  Capability = "Conditional"
  Faults = {}
  Start = "Empty"
  Retention = 0
  MaxEpoch = 2
  Nonces = {1, 2}
  MaxCrashes = 0
INVARIANTS
  TypeOK
  NoLostAck
CHECK_DEADLOCK FALSE

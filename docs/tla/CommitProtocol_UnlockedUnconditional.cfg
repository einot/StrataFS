\* CommitProtocol_UnlockedUnconditional: MustHold.
\* CommitProtocol_UnconditionalSingle with every later fix but FallbackOptIn
\* and with ADR 0023's two members: one writer on a backend with no
\* conditional writes, whose operator set Config.AllowUnconditionalRoot,
\* which the absence of FallbackOptIn describes (Assumption J17), with
\* snapshot Puts and fallback Puts that fail whether or not they took effect,
\* failed probes and a crash, able to change its namespace while its commit
\* is in flight. The fallback's Put and Head, and the probe after a lost
\* fallback reply, run holding no FS.mu (ADR 0023 section 2), and the guard
\* runs on the Head's success path and on the adoption alike. Every property
\* holds, DirtyUntilCommitted included.
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
\*   PruneBelowCurrent: ADR 0019 section 2, the fix for #88 (no pass runs
\*     here, since Retention is 0)
\*   AtomicLoad: ADR 0020 section 2, the fix for #89
\*   RootProbe: ADR 0022 sections 1 to 4, the fix for #5 and #103
\*   UnlockedCommit: ADR 0023 sections 1, 2 and 4, the fix for #43
\*   ClearIfUnchanged: ADR 0023 section 3, the guard #43's fix needs
\*   FallbackOptIn is left out on purpose: with it and no opt-in no commit on
\*     this backend succeeds (ADR 0021 section 2; J17)
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence", "PruneBelowCurrent", "AtomicLoad", "RootProbe", "UnlockedCommit", "ClearIfUnchanged"}
  Capability = "Unconditional"
  Faults = {"PutFailed", "SnapshotReplyLost", "FallbackReplyLost", "ProbeFailed"}
  Start = "Empty"
  Retention = 0
  MaxEpoch = 3
  Nonces = {1, 2}
  MaxCrashes = 1
INVARIANTS
  TypeOK
  RootSnapshotExists
  NoLostAck
  ChunksBeforeRoot
  ReadOnlyNeverWrites
  NoSelfDivergence
  DirtyUntilCommitted
CHECK_DEADLOCK FALSE

\* CommitProtocol_PruneTwoWritersFromEmpty: MustHold.
\* Two writers from an empty bucket, each pruning at retention 1, with three
\* nonces, failed swaps, snapshot Puts that fail whether or not they took
\* effect, and a crash: the first MustHold configuration in which a writer
\* loads a root pointer the other writer is moving, so #89's window, and the
\* window a restart reopens, are in its bounds. With AtomicLoad every mount's
\* ETag is that of the body it loaded (ADR 0020 section 1), so the loser of a
\* swap diverges and nothing acknowledged is lost; and with PruneBelowCurrent
\* the root pointer's key only rises past the one a pass was begun for (ADR
\* 0019 section 1), with no residual left to #89, so neither mount's pass
\* deletes the snapshot the root pointer names. Every property holds. Widens
\* the envelope of Assumption J11. CommitProtocol_NoAtomicLoadPrune is these
\* bounds narrowed to one fault and no crash, without AtomicLoad.
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
\*   PruneBelowCurrent: ADR 0019 section 2, the fix for #88
\*   AtomicLoad: ADR 0020 section 2, the fix for #89
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A", "B"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence", "PruneBelowCurrent", "AtomicLoad"}
  Capability = "Conditional"
  Faults = {"SwapFailed", "PutFailed", "SnapshotReplyLost"}
  Start = "Empty"
  Retention = 1
  MaxEpoch = 2
  Nonces = {1, 2, 3}
  MaxCrashes = 1
INVARIANTS
  TypeOK
  RootSnapshotExists
  NoLostAck
  ChunksBeforeRoot
  ReadOnlyNeverWrites
  NoSelfDivergence
CHECK_DEADLOCK FALSE

\* CommitProtocol_PruneSnapshotReplyRetention2: MustFail, RootSnapshotExists.
\* Issue #88, routes 3 and 4 at once, at retention 2: the bounds of
\* CommitProtocol_PruneSingle with one fault, SnapshotReplyLost. A prune pass
\* begun at epoch 1 is still listing after the commit at epoch 2 has swapped
\* (route 3's overlap). Then a snapshot Put at epoch 3 takes effect and fails
\* (route 4's orphan), and the next commit puts a second snapshot at epoch 3,
\* which has still to swap. Those two keys sort above the snapshot the root
\* pointer names, so retention 2 keeps them and deletes the root's. So a fix
\* for #88 cannot rest on a retention above 1 (Assumption J11). It flips to
\* MustHold, with the fix added to Fixes, when #88's fix lands.
\* Expected route, as TLC reported it for these bounds: InitEmpty,
\* PutSnapshot [1,1] and SwapOK, which starts the pass; Mutate, PutSnapshot
\* [2,1] and SwapOK; Mutate, and PutSnapshot [3,1], which takes effect and
\* fails; PutSnapshot [3,2]; PruneList, which keeps [3,1] and [3,2] and dooms
\* [2,1]; PruneDelete [2,1].
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence"}
  Capability = "Conditional"
  Faults = {"SnapshotReplyLost"}
  Start = "Empty"
  Retention = 2
  MaxEpoch = 4
  Nonces = {1, 2}
  MaxCrashes = 1
INVARIANTS
  TypeOK
  RootSnapshotExists
CHECK_DEADLOCK FALSE

\* CommitProtocol_PruneOverlap: MustFail, RootSnapshotExists.
\* Issue #88, route 3: one listing overlapping two commits. A prune pass
\* begun at epoch 1 lists after the commit at epoch 2 and the snapshot Put
\* at epoch 3; at retention 1 it keeps epoch 3's unswapped snapshot and
\* deletes epoch 2's, which the root pointer names. One mount with no faults
\* excludes routes 1 and 2. It flips to MustHold, with the fix added to
\* Fixes, when #88's fix lands.
\* Expected route: init [1,1], starting the pass; Mutate, PutSnapshot [2,1]
\* and SwapOK while the pass is still listing; Mutate and PutSnapshot [3,1];
\* PruneList, which keeps [3,1] and dooms [2,1]; PruneDelete [2,1].
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence"}
  Capability = "Conditional"
  Faults = {}
  Start = "Empty"
  Retention = 1
  MaxEpoch = 3
  Nonces = {1}
  MaxCrashes = 0
INVARIANTS
  TypeOK
  RootSnapshotExists
CHECK_DEADLOCK FALSE

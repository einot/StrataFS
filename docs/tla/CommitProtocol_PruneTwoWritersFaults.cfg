\* CommitProtocol_PruneTwoWritersFaults: MustHold.
\* Two writers that loaded one root pointer, each pruning at retention 1,
\* with failed swaps and snapshot Puts that fail whether or not they took
\* effect: the bounds of CommitProtocol_TwoWriters with pruning on. With
\* PruneBelowCurrent, every property holds: the loser of a swap diverges, as
\* in TwoWriters, and neither mount's pass deletes the snapshot the root
\* pointer names, since every swap is conditional and so the root pointer's
\* key only rises (ADR 0019 section 1). Start "Loaded" keeps #89's window
\* out, as TwoWriters does. Widens the envelope of Assumption J11.
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
\*   PruneBelowCurrent: ADR 0019 section 2, the fix for #88
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A", "B"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence", "PruneBelowCurrent"}
  Capability = "Conditional"
  Faults = {"SwapFailed", "PutFailed", "SnapshotReplyLost"}
  Start = "Loaded"
  Retention = 1
  MaxEpoch = 3
  Nonces = {1, 2}
  MaxCrashes = 0
INVARIANTS
  TypeOK
  RootSnapshotExists
  NoLostAck
  ChunksBeforeRoot
  ReadOnlyNeverWrites
  NoSelfDivergence
CHECK_DEADLOCK FALSE

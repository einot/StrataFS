\* CommitProtocol_SnapshotBeforeChunks: MustFail, ChunksBeforeRoot.
\* Removes ChunksFirst (ADR 0012 section 2; in the code since 247ef90, and
\* 3deecf1 changed flushAll) from CommitProtocol, so a commit runs its swap,
\* then its snapshot Put, then its flush (Assumption J7): the snapshot the
\* root pointer names includes a commit whose chunk is not stored.
\* Expected route: the init's reversed commit; then Mutate, SwapOK at epoch
\* 2, and PutSnapshot at epoch 2, before Flush stores A's epoch-2 chunk.
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ReadOnlyFence: ADR 0011 section 3
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ReadOnlyFence"}
  Capability = "Conditional"
  Faults = {"SwapFailed", "PutFailed"}
  Start = "Empty"
  Retention = 0
  MaxEpoch = 3
  Nonces = {1, 2}
  MaxCrashes = 1
INVARIANTS
  TypeOK
  ChunksBeforeRoot
CHECK_DEADLOCK FALSE

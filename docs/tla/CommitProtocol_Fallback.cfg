\* CommitProtocol_Fallback: MustFail, NoLostAck.
\* Issue #91: one 501 becomes a blind overwrite. On a backend that honours
\* conditional writes but may answer any one of them 501 (Flaky), a single
\* 501 sends a writer to the fallback's unconditional Put of the root
\* pointer, which replaces another writer's acknowledged commit. It flips to
\* MustHold, with the fix added to Fixes, when #91's fix lands.
\* Expected route: A runs Mutate, PutSnapshot [2,1] and SwapOK; B runs
\* Mutate, PutSnapshot [2,2] and SwapUnsupported, whose fallback Put
\* overwrites the root pointer, and A's epoch-2 commit is lost.
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A", "B"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence"}
  Capability = "Flaky"
  Faults = {}
  Start = "Loaded"
  Retention = 0
  MaxEpoch = 2
  Nonces = {1, 2}
  MaxCrashes = 0
INVARIANTS
  TypeOK
  NoLostAck
CHECK_DEADLOCK FALSE

\* CommitProtocol_Fallback: MustHold.
\* Issue #91: one 501 became a blind overwrite. On a backend that honours
\* conditional writes but may answer any one of them 501 (Flaky), a single
\* 501 sent a writer to the fallback's unconditional Put of the root pointer,
\* which replaced another writer's acknowledged commit. Flipped to MustHold
\* by ADR 0021, which added FallbackOptIn to Fixes: a swap the store answers
\* 501 fails the commit on a mount whose operator did not opt in, nothing
\* more is written, and the next commit tries the swap again, so the other
\* writer's commit stands and the retry's If-Match detects it.
\* CommitProtocol_NoFallbackOptIn is this configuration without the member.
\* Route it showed before the flip, as TLC reported it at 247a276: A runs
\* Mutate, PutSnapshot [2,1] and SwapOK; B runs Mutate, PutSnapshot [2,2]
\* and SwapUnsupported, whose fallback Put overwrites the root pointer, and
\* A's epoch-2 commit is no longer in the root pointer's snapshot.
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
\*   FallbackOptIn: ADR 0021 section 2, the fix for #91
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A", "B"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence", "FallbackOptIn"}
  Capability = "Flaky"
  Faults = {}
  Start = "Loaded"
  Retention = 0
  MaxEpoch = 2
  Nonces = {1, 2}
  MaxCrashes = 0
INVARIANTS
  TypeOK
  NoLostAck
CHECK_DEADLOCK FALSE

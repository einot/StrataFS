\* CommitProtocol_NoReadOnlyFence: MustFail, ReadOnlyNeverWrites.
\* Removes ReadOnlyFence (ADR 0011 section 3) from CommitProtocol_Follower,
\* so no store.ReadOnly stands under the read-only mount R: once a stray path
\* dirties it, R's commit writes to the bucket.
\* Expected route: A inits; R runs GetRoot, HeadRoot, GetSnapshot and
\* StrayDirty; R's unfenced PutSnapshot writes a snapshot holding R's commit.
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A", "R"}
  ReadOnlyMounts = {"R"}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst"}
  Capability = "Conditional"
  Faults = {}
  Start = "Empty"
  Retention = 0
  MaxEpoch = 3
  Nonces = {1, 2}
  MaxCrashes = 1
INVARIANTS
  TypeOK
  ReadOnlyNeverWrites
CHECK_DEADLOCK FALSE

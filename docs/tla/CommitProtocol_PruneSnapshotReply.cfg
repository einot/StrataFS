\* CommitProtocol_PruneSnapshotReply: MustHold.
\* Issue #88, route 4: a snapshot Put that takes effect and fails leaves an
\* orphan, with no failed swap. S3.Put can take effect and still return an
\* error (Assumption J4), so commitLocked fails, and the next commit tries
\* the same epoch under a new nonce. A prune pass begun at epoch 1 lists
\* after that retry has put its snapshot below the orphan and swapped; at
\* retention 1 the pass of 13aebc4 kept the orphan and deleted the snapshot
\* the root pointer names. Its one fault, SnapshotReplyLost, excludes routes
\* 1 and 5, one mount route 2, and MaxEpoch 2 route 3. Flipped to MustHold
\* by ADR 0019, which added PruneBelowCurrent to Fixes: the pass deletes only
\* keys below epoch 1's, of which there are none.
\* Route it showed before the flip: InitEmpty, PutSnapshot [1,n] and SwapOK,
\* which starts the pass; Mutate, and PutSnapshot [2,2], which takes effect
\* and fails; PutSnapshot [2,1] and SwapOK; PruneList, which keeps [2,2] and
\* dooms [2,1]; PruneDelete [2,1].
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
\*   PruneBelowCurrent: ADR 0019 section 2, the fix for #88
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence", "PruneBelowCurrent"}
  Capability = "Conditional"
  Faults = {"SnapshotReplyLost"}
  Start = "Empty"
  Retention = 1
  MaxEpoch = 2
  Nonces = {1, 2}
  MaxCrashes = 0
INVARIANTS
  TypeOK
  RootSnapshotExists
CHECK_DEADLOCK FALSE

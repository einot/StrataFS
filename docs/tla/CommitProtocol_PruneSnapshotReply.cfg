\* CommitProtocol_PruneSnapshotReply: MustFail, RootSnapshotExists.
\* Issue #88, route 4: a snapshot Put that takes effect and fails leaves an
\* orphan, with no failed swap. S3.Put can take effect and still return an
\* error (Assumption J4), so commitLocked fails and retries the epoch under
\* a new nonce. A prune pass begun at epoch 1 lists after the retry has put
\* its snapshot below the orphan and swapped; at retention 1 it keeps the
\* orphan and deletes the snapshot the root pointer names. Its one fault,
\* SnapshotReplyLost, excludes routes 1 and 5, one mount route 2, and
\* MaxEpoch 2 route 3. It flips to MustHold, with the fix added to Fixes,
\* when #88's fix lands.
\* Expected route: InitEmpty, PutSnapshot [1,n] and SwapOK, which starts the
\* pass; Mutate, and PutSnapshot [2,2], which takes effect and fails;
\* PutSnapshot [2,1] and SwapOK; PruneList, which keeps [2,2] and dooms
\* [2,1]; PruneDelete [2,1].
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence"}
  Capability = "Conditional"
  Faults = {"SnapshotReplyLost"}
  Start = "Empty"
  Retention = 1
  MaxEpoch = 2
  Nonces = {1, 2}
  MaxCrashes = 0
INVARIANTS
  TypeOK
  RootSnapshotExists
CHECK_DEADLOCK FALSE

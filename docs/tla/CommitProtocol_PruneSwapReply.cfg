\* CommitProtocol_PruneSwapReply: MustHold.
\* Issue #88, route 5, by the swap: a swap takes effect and fails
\* (SwapReplyLost), so the root pointer names that attempt's snapshot while
\* the next commit tries the same epoch under a new nonce. A prune pass begun
\* at epoch 1 lists after the retry's snapshot Put; at retention 1 the pass
\* of 13aebc4 kept the retry's snapshot, which sorts above, and deleted the
\* one the root pointer names. The retry's If-Match then fails on the stale
\* ETag, so the root pointer keeps naming the deleted snapshot. Its one fault
\* excludes routes 1 and 4, one mount route 2, and MaxEpoch 2 route 3.
\* Flipped to MustHold by ADR 0019, which added PruneBelowCurrent to Fixes:
\* the pass deletes only keys below epoch 1's, of which there are none, and
\* a swap that takes effect names a key above the one it matched (ADR 0019
\* section 1).
\* Route it showed before the flip: InitEmpty, PutSnapshot [1,n] and SwapOK,
\* which starts the pass; Mutate, PutSnapshot [2,1] and SwapReplyLost;
\* PutSnapshot [2,2]; PruneList, which keeps [2,2] and dooms [2,1];
\* PruneDelete [2,1].
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
\*   PruneBelowCurrent: ADR 0019 section 2, the fix for #88
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence", "PruneBelowCurrent"}
  Capability = "Conditional"
  Faults = {"SwapReplyLost"}
  Start = "Empty"
  Retention = 1
  MaxEpoch = 2
  Nonces = {1, 2}
  MaxCrashes = 0
INVARIANTS
  TypeOK
  RootSnapshotExists
CHECK_DEADLOCK FALSE

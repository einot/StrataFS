\* CommitProtocol_NoAtomicLoadPrune: MustFail, RootSnapshotExists.
\* Removes AtomicLoad (ADR 0020 section 2) from
\* CommitProtocol_PruneTwoWritersFromEmpty, with its faults narrowed to
\* SwapFailed and its crash left out: the residual ADR 0019 section 1 and
\* Assumption 4 left to #89's fix. Through #89's window a writer's swap names
\* a key below the one the other writer's pass was begun for, and a failed
\* attempt of its own leaves an orphan between the two, which fills the
\* retention, so the pass deletes the snapshot the root pointer names. Three
\* nonces alone do not reach it: the orphan needs a failed attempt, or a
\* third mount. NoLostAck fails earlier on the same behaviour, at the swap
\* through the window; this configuration checks RootSnapshotExists, which
\* is the residual ADR 0019 named.
\* Expected route: A inits [1,1], and its pass lists and ends with nothing to
\* delete; B runs GetRoot; A runs Mutate, PutSnapshot [2,3] and SwapOK, which
\* begins a pass for [2,3]; B runs HeadRoot, which takes A's ETag, and
\* GetSnapshot, which loads epoch 1; B runs Mutate, PutSnapshot [2,2] and
\* SwapFailed, then PutSnapshot [2,1] and SwapOK, below A's key; A's
\* PruneList keeps [2,2] as the newest key below [2,3] and dooms [1,1] and
\* [2,1]; A's PruneDelete [1,1], then PruneDelete [2,1], which the root
\* pointer names.
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
\*   PruneBelowCurrent: ADR 0019 section 2, the fix for #88
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A", "B"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence", "PruneBelowCurrent"}
  Capability = "Conditional"
  Faults = {"SwapFailed"}
  Start = "Empty"
  Retention = 1
  MaxEpoch = 2
  Nonces = {1, 2, 3}
  MaxCrashes = 0
INVARIANTS
  TypeOK
  RootSnapshotExists
CHECK_DEADLOCK FALSE

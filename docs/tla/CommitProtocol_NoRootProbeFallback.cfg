\* CommitProtocol_NoRootProbeFallback: MustFail, NoSelfDivergence.
\* Removes RootProbe (ADR 0022) from CommitProtocol_SelfDivergeFallback: the
\* configuration that showed #5's lost fallback reply until ADR 0022 flipped
\* it. On a backend that honours conditional writes but may answer any one
\* of them 501 (Flaky), an opted-in mount's fallback Put of the root pointer
\* takes effect and fails (FallbackReplyLost), commitLocked keeps its old
\* rootETag, and the mount's next swap fails its If-Match and diverges with
\* no other writer. Without FallbackOptIn the configuration describes an
\* opted-in mount (Assumption J17).
\* Expected route: Mutate, PutSnapshot [2,1], and SwapUnsupported, whose
\* fallback Put takes effect and fails; PutSnapshot [2,2]; SwapConflict.
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence"}
  Capability = "Flaky"
  Faults = {"FallbackReplyLost"}
  Start = "Loaded"
  Retention = 0
  MaxEpoch = 2
  Nonces = {1, 2}
  MaxCrashes = 0
INVARIANTS
  TypeOK
  NoSelfDivergence
CHECK_DEADLOCK FALSE

\* CommitProtocol_SwapNoETag: MustHold.
\* Issue #103, a swap reply with no ETag, with ADR 0022's fix for it: on a
\* backend that honours conditional writes, a swap takes effect and answers
\* 200 with no ETag header (SwapNoETag). With RootProbe the reply did not
\* establish the root pointer's ETag, so the root is in doubt, one read of
\* the root pointer shows it names the attempt, and the mount adopts it with
\* the read's ETag (ProbeOurs); its next swap is If-Match on that ETag and
\* succeeds. Written MustHold with the member, since the defect was shown
\* and closed by one ADR; CommitProtocol_NoRootProbeNoETag is this
\* configuration without the member, and shows the self-divergence.
\* Expected behaviour: Mutate, PutSnapshot [2,1], SwapNoETag, ProbeOurs;
\* Mutate, PutSnapshot [3,2], SwapOK.
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
\*   RootProbe: ADR 0022 sections 1 to 4, the fix for #5 and #103
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence", "RootProbe"}
  Capability = "Conditional"
  Faults = {"SwapNoETag"}
  Start = "Loaded"
  Retention = 0
  MaxEpoch = 3
  Nonces = {1, 2}
  MaxCrashes = 0
INVARIANTS
  TypeOK
  RootSnapshotExists
  NoLostAck
  ChunksBeforeRoot
  ReadOnlyNeverWrites
  NoSelfDivergence
CHECK_DEADLOCK FALSE

\* CommitProtocol_PruneFaultsSingle: MustHold.
\* One writer pruning at retention 1, with failed swaps, snapshot Puts that
\* fail whether or not they took effect, and a crash: the bounds of
\* CommitProtocol with pruning on, which CommitProtocol_PruneSingle left out
\* every fault of. With PruneBelowCurrent, every property holds: a pass
\* deletes only keys below the one its commit swapped the root pointer to,
\* and that key never falls (ADR 0019 section 1). Widens the envelope of
\* Assumption J11.
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
\*   PruneBelowCurrent: ADR 0019 section 2, the fix for #88
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence", "PruneBelowCurrent"}
  Capability = "Conditional"
  Faults = {"SwapFailed", "PutFailed", "SnapshotReplyLost"}
  Start = "Empty"
  Retention = 1
  MaxEpoch = 3
  Nonces = {1, 2}
  MaxCrashes = 1
INVARIANTS
  TypeOK
  RootSnapshotExists
  NoLostAck
  ChunksBeforeRoot
  ReadOnlyNeverWrites
  NoSelfDivergence
CHECK_DEADLOCK FALSE

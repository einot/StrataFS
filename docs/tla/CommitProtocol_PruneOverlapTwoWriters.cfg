\* CommitProtocol_PruneOverlapTwoWriters: MustFail, RootSnapshotExists.
\* Issue #88, routes 2 and 3 at once: a prune pass overlapping both its own
\* mount's commit and another mount's attempt. It is
\* CommitProtocol_PruneTwoWriters without the state constraint, every other
\* line but these comments the same, so it admits every behaviour
\* PassApartFromOwnCommits cuts from that configuration (Assumption J15). It
\* flips to MustHold, with the fix added to Fixes, when #88's fix lands,
\* together with PruneTwoWriters, whose flip the runner refuses without it
\* (docs/tla/README.md, Configuration files).
\* Expected route, the one TLC reported for these bounds before the
\* constraint was added: A inits [1,1], starting its pass; A commits [2,1]
\* with Mutate, PutSnapshot and SwapOK while the pass is still listing, and
\* B runs GetRoot before that swap and HeadRoot after it (#89's window); B
\* runs GetSnapshot, Mutate and PutSnapshot [2,2]; A's pass lists, keeping
\* [2,2] and dooming [2,1], which the root pointer names; A's PruneDelete
\* [2,1].
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A", "B"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence"}
  Capability = "Conditional"
  Faults = {}
  Start = "Empty"
  Retention = 1
  MaxEpoch = 2
  Nonces = {1, 2}
  MaxCrashes = 0
INVARIANTS
  TypeOK
  RootSnapshotExists
CHECK_DEADLOCK FALSE

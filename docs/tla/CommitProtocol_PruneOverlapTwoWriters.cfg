\* CommitProtocol_PruneOverlapTwoWriters: MustHold.
\* Issue #88, routes 2 and 3 at once: a prune pass overlapping both its own
\* mount's commit and another mount's attempt. It is
\* CommitProtocol_PruneTwoWriters without the state constraint, every other
\* line but these comments the same, so it admits every behaviour
\* PassApartFromOwnCommits cuts from that configuration (Assumption J15).
\* Flipped to MustHold by ADR 0019, which added PruneBelowCurrent to Fixes,
\* together with PruneTwoWriters, whose flip the runner refuses without it
\* (docs/tla/README.md, Configuration files): a pass deletes only keys below
\* the one it was begun for, and keeps the Retention newest of them. Start
\* "Empty" with two writers includes #89's window, in which the root
\* pointer's key can fall below the one a pass was begun for: A commits
\* [2,2] and begins a pass for it, and B, which ran GetRoot before that
\* swap and HeadRoot after it, swaps in [2,1] before the pass lists. ADR
\* 0019 section 1 leaves that fall to AtomicLoad. Within these bounds [2,1]
\* is the newest key below A's, and Retention 1 keeps it (ADR 0019
\* Assumption 4); the residual with three nonces is #89's, outside this fix.
\* Route it showed before the flip, the one TLC reported for these bounds
\* before the constraint was added: A inits [1,1], starting its pass; A
\* commits [2,1] with Mutate, PutSnapshot and SwapOK while the pass is still
\* listing, and B runs GetRoot before that swap and HeadRoot after it (#89's
\* window); B runs GetSnapshot, Mutate and PutSnapshot [2,2]; A's pass lists,
\* keeping [2,2] and dooming [2,1], which the root pointer names; A's
\* PruneDelete [2,1].
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
\*   PruneBelowCurrent: ADR 0019 section 2, the fix for #88
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A", "B"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence", "PruneBelowCurrent"}
  Capability = "Conditional"
  Faults = {}
  Start = "Empty"
  Retention = 1
  MaxEpoch = 2
  Nonces = {1, 2}
  MaxCrashes = 0
INVARIANTS
  TypeOK
  RootSnapshotExists
CHECK_DEADLOCK FALSE

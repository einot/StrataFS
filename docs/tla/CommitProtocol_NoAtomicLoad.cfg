\* CommitProtocol_NoAtomicLoad: MustFail, NoLostAck.
\* Removes AtomicLoad (ADR 0020 section 2) from CommitProtocol_LoadRace, so
\* loadOrInit takes the root pointer's ETag by a Head after the Get of its
\* body, as it did at 55fc666: #89, with two writers and no fault. It shows
\* that the member is needed, as ADR 0013 section 7 asks of every fix.
\* Expected route, the one TLC reported for CommitProtocol_LoadRace at
\* 55fc666: A inits [1,1]; B runs GetRoot; A runs Mutate, PutSnapshot [2,1]
\* and SwapOK; B runs HeadRoot, which takes A's ETag, GetSnapshot, which
\* loads A's epoch-1 commit only, Mutate, PutSnapshot [2,2] and SwapOK. A's
\* epoch-2 commit is no longer in the root pointer's snapshot.
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A", "B"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence"}
  Capability = "Conditional"
  Faults = {}
  Start = "Empty"
  Retention = 0
  MaxEpoch = 2
  Nonces = {1, 2}
  MaxCrashes = 0
INVARIANTS
  TypeOK
  NoLostAck
CHECK_DEADLOCK FALSE

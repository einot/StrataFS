\* CommitProtocol_NoClearIfUnchanged: MustFail, DirtyUntilCommitted.
\* Removes ClearIfUnchanged (ADR 0023) from CommitProtocol_Unlocked, narrowed
\* to one writer that loaded a root pointer, with no fault, one nonce and one
\* commit: the commit's store calls run holding no FS.mu (UnlockedCommit), a
\* change is made while the swap is in flight, and the commit's success
\* clears the dirty flag unconditionally, as commitLocked's success path did,
\* so the mount holds a change that no commit will carry: nsDirty is FALSE
\* while uncommitted is TRUE.
\* Expected route: Mutate, PutSnapshot [2,1], Mutate, SwapOK.
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
\*   PruneBelowCurrent: ADR 0019 section 2, the fix for #88 (no pass runs
\*     here, since Retention is 0)
\*   AtomicLoad: ADR 0020 section 2, the fix for #89 (no load runs here,
\*     since Start is "Loaded" and there is no crash)
\*   FallbackOptIn: ADR 0021 section 2, the fix for #91 (never reached, since
\*     the backend honours every conditional write)
\*   RootProbe: ADR 0022 sections 1 to 4, the fix for #5 and #103 (never
\*     reached, since no swap fails)
\*   UnlockedCommit: ADR 0023 sections 1, 2 and 4, the fix for #43
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence", "PruneBelowCurrent", "AtomicLoad", "FallbackOptIn", "RootProbe", "UnlockedCommit"}
  Capability = "Conditional"
  Faults = {}
  Start = "Loaded"
  Retention = 0
  MaxEpoch = 2
  Nonces = {1}
  MaxCrashes = 0
INVARIANTS
  TypeOK
  DirtyUntilCommitted
CHECK_DEADLOCK FALSE

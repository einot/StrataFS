\* CommitProtocol_PruneTwoWriters: MustFail, RootSnapshotExists.
\* Issue #88, route 2: a losing writer's orphan. A's prune pass, begun at
\* epoch 1, lists after B, which loaded A's root, and A, which then loses,
\* have each put an epoch-2 snapshot, A's above B's. At retention 1 it keeps
\* A's and deletes B's, which B's root pointer names from B's swap on,
\* whether the swap lands before the delete or after it. With no faults, no
\* failed swap leaves an orphan, and MaxEpoch 2 gives B a single commit. The
\* state constraint keeps A's pass apart from A's own commits (Assumption
\* J15): without it, TLC reported at the same length a pass overlapping its
\* own mount's next commit, through #89's window. So the only key that can
\* sort above B's is A's losing attempt. It flips to MustHold, with the fix
\* added to Fixes, when #88's fix lands, and its twin, which has the same
\* constants and invariants and no constraint,
\* CommitProtocol_PruneOverlapTwoWriters, flips with it (docs/tla/README.md,
\* Configuration files).
\* Expected route: A inits [1,1], starting its pass; A runs Mutate and
\* PutSnapshot [2,2]; B runs GetRoot, HeadRoot, GetSnapshot, Mutate and
\* PutSnapshot [2,1]; A's pass lists, keeping [2,2] and dooming [2,1]; then
\* B's SwapOK and A's PruneDelete [2,1], in either order.
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A", "B"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence"}
  Capability = "Conditional"
  Faults = {}
  Start = "Empty"
  Retention = 1
  MaxEpoch = 2
  Nonces = {1, 2}
  MaxCrashes = 0
CONSTRAINT
  PassApartFromOwnCommits
INVARIANTS
  TypeOK
  RootSnapshotExists
CHECK_DEADLOCK FALSE

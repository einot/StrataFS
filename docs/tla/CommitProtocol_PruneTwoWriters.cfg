\* CommitProtocol_PruneTwoWriters: MustFail, RootSnapshotExists.
\* Issue #88, route 2: a losing writer's orphan. A's prune pass, begun at
\* epoch 1, lists after B has committed at epoch 2 and A, which then loses,
\* has put its own epoch-2 snapshot above B's; at retention 1 it deletes the
\* snapshot B's root pointer names. No faults and MaxEpoch 2 exclude routes
\* 1 and 3. It flips to MustHold, with the fix added to Fixes, when #88's
\* fix lands.
\* Expected route: A inits [1,1], starting its pass; B runs GetRoot,
\* HeadRoot, GetSnapshot, Mutate, PutSnapshot [2,1] and SwapOK; A runs
\* Mutate and PutSnapshot [2,2]; A's pass lists, keeps [2,2] and deletes
\* [2,1].
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A", "B"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence"}
  Capability = "Conditional"
  Faults = {}
  Start = "Empty"
  Retention = 1
  MaxEpoch = 2
  Nonces = {1, 2}
  MaxCrashes = 0
INVARIANTS
  TypeOK
  RootSnapshotExists
CHECK_DEADLOCK FALSE

\* CommitProtocol_UnlockedProbeTwoWriters: MustHold.
\* CommitProtocol_ProbeTwoWriters with ADR 0023's two members: two writers
\* that loaded one root pointer, with every swap fault, snapshot Puts that
\* fail whether or not they took effect, and failed probes, each able to
\* change its namespace while its own commit is in flight. The probe's three
\* verdicts stay pinned by NoLostAck and NoSelfDivergence (Assumption J19)
\* with a change racing the flight: a change writes nothing the swap or the
\* verdict reads (ADR 0023 section 5), so it can make a mount neither adopt
\* another's attempt, overwrite another's commit nor diverge alone; and
\* DirtyUntilCommitted holds, so the change is carried by a later commit or
\* refused with the diverged mount.
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
\*   PruneBelowCurrent: ADR 0019 section 2, the fix for #88 (no pass runs
\*     here, since Retention is 0)
\*   AtomicLoad: ADR 0020 section 2, the fix for #89 (no load runs here,
\*     since Start is "Loaded" and there is no crash)
\*   FallbackOptIn: ADR 0021 section 2, the fix for #91 (never reached, since
\*     the backend honours every conditional write)
\*   RootProbe: ADR 0022 sections 1 to 4, the fix for #5 and #103
\*   UnlockedCommit: ADR 0023 sections 1, 2 and 4, the fix for #43
\*   ClearIfUnchanged: ADR 0023 section 3, the guard #43's fix needs
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A", "B"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence", "PruneBelowCurrent", "AtomicLoad", "FallbackOptIn", "RootProbe", "UnlockedCommit", "ClearIfUnchanged"}
  Capability = "Conditional"
  Faults = {"SwapReplyLost", "SwapFailed", "SwapConflict409", "SwapNoETag", "PutFailed", "SnapshotReplyLost", "ProbeFailed"}
  Start = "Loaded"
  Retention = 0
  MaxEpoch = 3
  Nonces = {1, 2}
  MaxCrashes = 0
INVARIANTS
  TypeOK
  RootSnapshotExists
  NoLostAck
  ChunksBeforeRoot
  ReadOnlyNeverWrites
  NoSelfDivergence
  DirtyUntilCommitted
CHECK_DEADLOCK FALSE

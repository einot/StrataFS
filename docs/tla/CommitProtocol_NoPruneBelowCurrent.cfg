\* CommitProtocol_NoPruneBelowCurrent: MustFail, RootSnapshotExists.
\* Removes PruneBelowCurrent (ADR 0019 section 2) from
\* CommitProtocol_PruneOverlap, so a prune pass deletes every listed key but
\* the Retention newest and spares only the keys of the epoch it was begun
\* for, as pruneSnapshots did at 13aebc4: #88's route 3, one listing
\* overlapping two commits, with one mount and no fault. It shows that the
\* member is needed, as ADR 0013 section 7 asks of every fix.
\* Expected route: init [1,1], starting the pass; Mutate, PutSnapshot [2,1]
\* and SwapOK while the pass is still listing; Mutate and PutSnapshot [3,1];
\* PruneList, which keeps [3,1] and dooms [2,1]; PruneDelete [2,1].
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence"}
  Capability = "Conditional"
  Faults = {}
  Start = "Empty"
  Retention = 1
  MaxEpoch = 3
  Nonces = {1}
  MaxCrashes = 0
INVARIANTS
  TypeOK
  RootSnapshotExists
CHECK_DEADLOCK FALSE

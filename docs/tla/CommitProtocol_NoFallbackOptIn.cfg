\* CommitProtocol_NoFallbackOptIn: MustFail, NoLostAck.
\* Removes FallbackOptIn (ADR 0021 section 2) from CommitProtocol_Fallback,
\* so a swap the store answers 501 falls back to an unconditional Put of the
\* root pointer, as commitLocked did at 247a276: #91, with two writers on a
\* backend that honours conditional writes but may answer any one of them
\* 501 (Flaky). It shows that the member is needed, as ADR 0013 section 7
\* asks of every fix. Without the member the configuration also reads as two
\* writers whose operator opted in (Config.AllowUnconditionalRoot) on such a
\* backend, which behave alike (Assumption J17).
\* Expected route, the one TLC reported for CommitProtocol_Fallback at
\* 247a276: A runs Mutate, PutSnapshot [2,1] and SwapOK; B runs Mutate,
\* PutSnapshot [2,2] and SwapUnsupported, whose fallback Put overwrites the
\* root pointer, and A's epoch-2 commit is no longer in the root pointer's
\* snapshot.
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A", "B"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence"}
  Capability = "Flaky"
  Faults = {}
  Start = "Loaded"
  Retention = 0
  MaxEpoch = 2
  Nonces = {1, 2}
  MaxCrashes = 0
INVARIANTS
  TypeOK
  NoLostAck
CHECK_DEADLOCK FALSE

\* CommitProtocol_UnconditionalSingle: MustHold.
\* One writer on a backend with no conditional writes, which answers every
\* swap 501, with snapshot Puts and fallback Puts that fail whether or not
\* they took effect, and a crash: the fallback's unconditional Put of the
\* root pointer is safe for a single writer (docs/DESIGN.md section 2).
\* Since ADR 0021 the fallback follows a 501 only on a mount whose operator
\* set Config.AllowUnconditionalRoot, which this configuration, without
\* FallbackOptIn, describes (Assumption J17): it is what the opt-in is shown
\* safe for. With the member and no opt-in no commit on such a backend
\* succeeds, and New over an empty bucket fails.
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence"}
  Capability = "Unconditional"
  Faults = {"PutFailed", "SnapshotReplyLost", "FallbackReplyLost"}
  Start = "Empty"
  Retention = 0
  MaxEpoch = 3
  Nonces = {1, 2}
  MaxCrashes = 1
INVARIANTS
  TypeOK
  RootSnapshotExists
  NoLostAck
  ChunksBeforeRoot
  ReadOnlyNeverWrites
  NoSelfDivergence
CHECK_DEADLOCK FALSE

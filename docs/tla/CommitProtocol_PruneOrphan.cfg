\* CommitProtocol_PruneOrphan: MustHold.
\* Issue #88, route 1: a failed swap's orphan. A prune pass begun at epoch 1
\* lists after a failed swap has left a snapshot at epoch 2 and the retry
\* has committed another below it; at retention 1 the pass of 13aebc4 kept
\* the orphan and deleted the snapshot the root pointer names. MaxEpoch 2
\* excludes route 3, and one mount excludes route 2. Flipped to MustHold by
\* ADR 0019, which added PruneBelowCurrent to Fixes: the pass deletes only
\* keys below the one it was begun for, and nothing sorts below epoch 1's.
\* Route it showed before the flip: InitEmpty, PutSnapshot [1,n] and SwapOK,
\* which starts the pass; Mutate, PutSnapshot [2,2] and SwapFailed;
\* PutSnapshot [2,1] and SwapOK; PruneList, which keeps [2,2] and dooms
\* [2,1]; PruneDelete [2,1].
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
\*   PruneBelowCurrent: ADR 0019 section 2, the fix for #88
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence", "PruneBelowCurrent"}
  Capability = "Conditional"
  Faults = {"SwapFailed"}
  Start = "Empty"
  Retention = 1
  MaxEpoch = 2
  Nonces = {1, 2}
  MaxCrashes = 0
INVARIANTS
  TypeOK
  RootSnapshotExists
CHECK_DEADLOCK FALSE

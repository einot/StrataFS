\* CommitProtocol_PruneOrphan: MustFail, RootSnapshotExists.
\* Issue #88, route 1: a failed swap's orphan. A prune pass begun at epoch 1
\* lists after a failed swap has left a snapshot at epoch 2 and the retry
\* has committed another below it; at retention 1 it keeps the orphan and
\* deletes the snapshot the root pointer names. MaxEpoch 2 excludes route 3,
\* and one mount excludes route 2. It flips to MustHold, with the fix added
\* to Fixes, when #88's fix lands.
\* Expected route: InitEmpty, PutSnapshot [1,n] and SwapOK, which starts the
\* pass; Mutate, PutSnapshot [2,2] and SwapFailed; PutSnapshot [2,1] and
\* SwapOK; PruneList, which keeps [2,2] and dooms [2,1]; PruneDelete [2,1].
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence"}
  Capability = "Conditional"
  Faults = {"SwapFailed"}
  Start = "Empty"
  Retention = 1
  MaxEpoch = 2
  Nonces = {1, 2}
  MaxCrashes = 0
INVARIANTS
  TypeOK
  RootSnapshotExists
CHECK_DEADLOCK FALSE

\* CommitProtocol_ProbeFailed: MustHold.
\* One writer from an empty bucket with every swap fault (a lost reply, an
\* untyped failure, a 409 while the condition holds, a reply with no ETag),
\* snapshot Puts that fail whether or not they took effect, failed probes and
\* a crash, with every fix the code has (ADR 0022 Assumption 16). A mount
\* left in doubt by a failed read settles the root pointer at its next
\* commit, before it writes anything (NextStep "Probe"), and a crash forgets
\* the doubt and reloads whatever the bucket holds. Every property holds:
\* nothing acknowledged is lost, the root pointer always names a snapshot
\* the bucket holds, and the mount never diverges alone.
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
\*   PruneBelowCurrent: ADR 0019 section 2, the fix for #88 (no pass runs
\*     here, since Retention is 0)
\*   AtomicLoad: ADR 0020 section 2, the fix for #89
\*   FallbackOptIn: ADR 0021 section 2, the fix for #91 (never reached, since
\*     the backend honours every conditional write)
\*   RootProbe: ADR 0022 sections 1 to 4, the fix for #5 and #103
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence", "PruneBelowCurrent", "AtomicLoad", "FallbackOptIn", "RootProbe"}
  Capability = "Conditional"
  Faults = {"SwapReplyLost", "SwapFailed", "SwapConflict409", "SwapNoETag", "PutFailed", "SnapshotReplyLost", "ProbeFailed"}
  Start = "Empty"
  Retention = 0
  MaxEpoch = 3
  Nonces = {1, 2}
  MaxCrashes = 1
INVARIANTS
  TypeOK
  RootSnapshotExists
  NoLostAck
  ChunksBeforeRoot
  ReadOnlyNeverWrites
  NoSelfDivergence
CHECK_DEADLOCK FALSE

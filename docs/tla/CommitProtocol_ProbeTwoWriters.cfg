\* CommitProtocol_ProbeTwoWriters: MustHold.
\* Two writers that loaded one root pointer, with every swap fault (a lost
\* reply, an untyped failure, a 409 while the condition holds, a reply with
\* no ETag), snapshot Puts that fail whether or not they took effect, and
\* failed probes, with every fix the code has (ADR 0022 Assumption 16). The
\* probe's three verdicts are pinned together by NoLostAck and
\* NoSelfDivergence (Assumption J19): a read adopts only this mount's own
\* attempt, takes an ETag only against the key its namespace descends from,
\* and diverges a mount only after another writer's root pointer. The loser
\* of a swap diverges, through ProbeTheirs, and nothing acknowledged is
\* lost; a mount whose lost reply another writer then overtakes diverges
\* rather than adopting.
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
\*   PruneBelowCurrent: ADR 0019 section 2, the fix for #88 (no pass runs
\*     here, since Retention is 0)
\*   AtomicLoad: ADR 0020 section 2, the fix for #89 (no load runs here,
\*     since Start is "Loaded" and there is no crash)
\*   FallbackOptIn: ADR 0021 section 2, the fix for #91 (never reached, since
\*     the backend honours every conditional write)
\*   RootProbe: ADR 0022 sections 1 to 4, the fix for #5 and #103
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A", "B"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence", "PruneBelowCurrent", "AtomicLoad", "FallbackOptIn", "RootProbe"}
  Capability = "Conditional"
  Faults = {"SwapReplyLost", "SwapFailed", "SwapConflict409", "SwapNoETag", "PutFailed", "SnapshotReplyLost", "ProbeFailed"}
  Start = "Loaded"
  Retention = 0
  MaxEpoch = 3
  Nonces = {1, 2}
  MaxCrashes = 0
INVARIANTS
  TypeOK
  RootSnapshotExists
  NoLostAck
  ChunksBeforeRoot
  ReadOnlyNeverWrites
  NoSelfDivergence
CHECK_DEADLOCK FALSE

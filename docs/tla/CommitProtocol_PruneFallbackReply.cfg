\* CommitProtocol_PruneFallbackReply: MustFail, RootSnapshotExists.
\* Issue #88, route 5, by the fallback: on a backend with no conditional
\* writes, the fallback's Put of the root pointer takes effect and fails
\* (FallbackReplyLost), so the root pointer names that attempt's snapshot
\* while the next commit tries the same epoch under a new nonce. A prune pass
\* begun at epoch 1 lists after the retry's snapshot Put; at retention 1 it
\* keeps the retry's snapshot, which sorts above, and deletes the one the
\* root pointer names, before the retry's own Put of the root pointer. Its
\* one fault excludes routes 1 and 4, one mount route 2, and MaxEpoch 2
\* route 3. It flips to MustHold, with the fix added to Fixes, when #88's
\* fix lands.
\* Expected route: InitEmpty, PutSnapshot [1,n], SwapUnsupported and
\* FallbackHead, which starts the pass; Mutate, PutSnapshot [2,1], and
\* SwapUnsupported, whose fallback Put takes effect and fails; PutSnapshot
\* [2,2]; PruneList, which keeps [2,2] and dooms [2,1]; PruneDelete [2,1].
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence"}
  Capability = "Unconditional"
  Faults = {"FallbackReplyLost"}
  Start = "Empty"
  Retention = 1
  MaxEpoch = 2
  Nonces = {1, 2}
  MaxCrashes = 0
INVARIANTS
  TypeOK
  RootSnapshotExists
CHECK_DEADLOCK FALSE

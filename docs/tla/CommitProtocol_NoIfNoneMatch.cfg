\* CommitProtocol_NoIfNoneMatch: MustFail, NoLostAck.
\* Removes IfNoneMatchInit (247ef90, which introduced it; no ADR section
\* decides it) from CommitProtocol_InitRace, so initEmpty's swap is
\* unconditional (Assumption J8): the second first mount's init overwrites
\* the first's, and the first's acknowledged commit is lost.
\* Expected route: A and B both InitEmpty; A puts its snapshot and swaps; B
\* puts its snapshot, and its unconditional swap replaces A's root.
\* Fixes, and the source of each:
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A", "B"}
  ReadOnlyMounts = {}
  Fixes = {"Nonce", "ChunksFirst", "ReadOnlyFence"}
  Capability = "Conditional"
  Faults = {}
  Start = "Empty"
  Retention = 0
  MaxEpoch = 1
  Nonces = {1, 2}
  MaxCrashes = 0
INVARIANTS
  TypeOK
  NoLostAck
CHECK_DEADLOCK FALSE

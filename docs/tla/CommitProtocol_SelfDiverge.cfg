\* CommitProtocol_SelfDiverge: MustHold.
\* Issue #5, a lost reply: a swap that took effect answered with an error, so
\* commitLocked kept its old rootETag, and the mount's next swap failed its
\* If-Match and diverged with no other writer. Flipped to MustHold by ADR
\* 0022, which added RootProbe to Fixes: the swap's outcome is in doubt, one
\* read of the root pointer shows it names the attempt, and the mount adopts
\* it (ProbeOurs), so no further swap is made against the stale ETag.
\* CommitProtocol_NoRootProbe is this configuration without the member.
\* Route it showed before the flip: Mutate, PutSnapshot [2,1], SwapReplyLost,
\* PutSnapshot [2,2], SwapConflict.
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
\*   RootProbe: ADR 0022 sections 1 to 4, the fix for #5
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence", "RootProbe"}
  Capability = "Conditional"
  Faults = {"SwapReplyLost"}
  Start = "Loaded"
  Retention = 0
  MaxEpoch = 2
  Nonces = {1, 2}
  MaxCrashes = 0
INVARIANTS
  TypeOK
  NoSelfDivergence
CHECK_DEADLOCK FALSE

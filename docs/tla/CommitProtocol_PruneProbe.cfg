\* CommitProtocol_PruneProbe: MustHold.
\* One writer pruning at retention 1, with lost swap replies, failed swaps,
\* snapshot Puts that take effect and fail, failed probes and a crash, with
\* every fix the code has (ADR 0022 Assumption 16): the bounds of
\* CommitProtocol_PruneFaultsSingle with the faults ADR 0022's probe
\* answers. An attempt the probe adopts is the key the root pointer already
\* names, so it is at or above every pass's key, and the swap after an
\* adoption is one epoch higher (ADR 0022 section 5; Assumption J11), so the
\* snapshot the root pointer names is never deleted, and every property
\* holds.
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
\*   PruneBelowCurrent: ADR 0019 section 2, the fix for #88
\*   AtomicLoad: ADR 0020 section 2, the fix for #89
\*   FallbackOptIn: ADR 0021 section 2, the fix for #91 (never reached, since
\*     the backend honours every conditional write)
\*   RootProbe: ADR 0022 sections 1 to 4, the fix for #5 and #103
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence", "PruneBelowCurrent", "AtomicLoad", "FallbackOptIn", "RootProbe"}
  Capability = "Conditional"
  Faults = {"SwapReplyLost", "SwapFailed", "SnapshotReplyLost", "ProbeFailed"}
  Start = "Empty"
  Retention = 1
  MaxEpoch = 3
  Nonces = {1, 2}
  MaxCrashes = 1
INVARIANTS
  TypeOK
  RootSnapshotExists
  NoLostAck
  ChunksBeforeRoot
  ReadOnlyNeverWrites
  NoSelfDivergence
CHECK_DEADLOCK FALSE

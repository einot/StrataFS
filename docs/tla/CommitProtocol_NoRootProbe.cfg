\* CommitProtocol_NoRootProbe: MustFail, NoSelfDivergence.
\* Removes RootProbe (ADR 0022) from CommitProtocol_SelfDiverge: the
\* configuration that showed #5's lost reply until ADR 0022 flipped it. A
\* swap that takes effect answers with an error, commitLocked keeps its old
\* rootETag, and the mount's next swap fails its If-Match and diverges with
\* no other writer.
\* Expected route: Mutate, PutSnapshot [2,1], SwapReplyLost, PutSnapshot
\* [2,2], SwapConflict.
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence"}
  Capability = "Conditional"
  Faults = {"SwapReplyLost"}
  Start = "Loaded"
  Retention = 0
  MaxEpoch = 2
  Nonces = {1, 2}
  MaxCrashes = 0
INVARIANTS
  TypeOK
  NoSelfDivergence
CHECK_DEADLOCK FALSE

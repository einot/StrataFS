\* CommitProtocol_NoNonce: MustFail, NoLostAck.
\* Removes Nonce (ADR 0013 section 4 and Assumption 6; in the code since
\* 247ef90) from CommitProtocol_TwoWriters, so every key at an epoch is the
\* same key: the loser's snapshot Put overwrites the winner's snapshot, which
\* the root pointer names.
\* Expected route: A commits [2,0] and is acknowledged; B's PutSnapshot of
\* [2,0] then replaces the snapshot's contents.
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A", "B"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "ChunksFirst", "ReadOnlyFence"}
  Capability = "Conditional"
  Faults = {"SwapFailed", "PutFailed"}
  Start = "Loaded"
  Retention = 0
  MaxEpoch = 3
  Nonces = {1, 2}
  MaxCrashes = 0
INVARIANTS
  TypeOK
  NoLostAck
CHECK_DEADLOCK FALSE

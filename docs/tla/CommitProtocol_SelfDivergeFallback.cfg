\* CommitProtocol_SelfDivergeFallback: MustHold.
\* Issue #5, a fallback Put that takes effect and fails: on a backend that
\* honours conditional writes but may answer any one of them 501 (Flaky),
\* the fallback's Put of the root pointer took effect and failed
\* (FallbackReplyLost), so commitLocked kept its old rootETag, and the
\* mount's next swap failed its If-Match and diverged with no other writer.
\* Flipped to MustHold by ADR 0022, which added RootProbe to Fixes: the
\* failed Put leaves the root in doubt, the read that follows shows the root
\* pointer naming the attempt, and the mount adopts it (ProbeOurs).
\* CommitProtocol_NoRootProbeFallback is this configuration without the
\* member.
\* Since ADR 0021 the fallback follows a 501 only on a mount whose operator
\* set Config.AllowUnconditionalRoot, which this configuration, without
\* FallbackOptIn, describes (Assumption J17): an opted-in mount on such a
\* backend. With FallbackOptIn and no opt-in the route is closed because no
\* fallback Put is made, not because #5 is fixed, so the configuration keeps
\* that member out and carries RootProbe instead.
\* Route it showed before the flip: Mutate, PutSnapshot [2,1], and
\* SwapUnsupported, whose fallback Put took effect and failed; PutSnapshot
\* [2,2]; SwapConflict.
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
\*   RootProbe: ADR 0022 sections 1 to 4, the fix for #5
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence", "RootProbe"}
  Capability = "Flaky"
  Faults = {"FallbackReplyLost"}
  Start = "Loaded"
  Retention = 0
  MaxEpoch = 2
  Nonces = {1, 2}
  MaxCrashes = 0
INVARIANTS
  TypeOK
  NoSelfDivergence
CHECK_DEADLOCK FALSE

\* CommitProtocol_SelfDivergeFallback: MustFail, NoSelfDivergence.
\* Issue #5, a fallback Put that takes effect and fails: on a backend that
\* honours conditional writes but may answer any one of them 501 (Flaky),
\* the fallback's Put of the root pointer takes effect and fails
\* (FallbackReplyLost), so commitLocked keeps its old rootETag, and the
\* mount's next swap fails its If-Match and diverges with no other writer.
\* It flips to MustHold, with the fix added to Fixes, when the root-pointer
\* knowledge of #5's ADR lands.
\* Since ADR 0021 the fallback follows a 501 only on a mount whose operator
\* set Config.AllowUnconditionalRoot, which this configuration, without
\* FallbackOptIn, describes (Assumption J17): an opted-in mount on such a
\* backend still diverges alone by this route. With the member and no opt-in
\* the route is closed because no fallback Put is made, not because #5 is
\* fixed, so the configuration keeps the member out and stays #5's.
\* Expected route: Mutate, PutSnapshot [2,1], and SwapUnsupported, whose
\* fallback Put takes effect and fails; PutSnapshot [2,2]; SwapConflict.
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence"}
  Capability = "Flaky"
  Faults = {"FallbackReplyLost"}
  Start = "Loaded"
  Retention = 0
  MaxEpoch = 2
  Nonces = {1, 2}
  MaxCrashes = 0
INVARIANTS
  TypeOK
  NoSelfDivergence
CHECK_DEADLOCK FALSE

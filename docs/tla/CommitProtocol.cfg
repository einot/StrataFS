\* CommitProtocol: MustHold.
\* One writer from an empty bucket, with failed swaps, failed puts and a
\* crash, and no pruning. It checks every property with all four fixes.
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence"}
  Capability = "Conditional"
  Faults = {"SwapFailed", "PutFailed"}
  Start = "Empty"
  Retention = 0
  MaxEpoch = 3
  Nonces = {1, 2}
  MaxCrashes = 1
INVARIANTS
  TypeOK
  RootSnapshotExists
  NoLostAck
  ChunksBeforeRoot
  ReadOnlyNeverWrites
  NoSelfDivergence
CHECK_DEADLOCK FALSE

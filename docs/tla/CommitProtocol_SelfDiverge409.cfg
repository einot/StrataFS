\* CommitProtocol_SelfDiverge409: MustHold.
\* Issue #5, a 409: a swap answered 409 Conflict while its condition held,
\* which errorFor maps to store.ErrPrecondition, made the mount diverge with
\* no other writer (Assumption J4). Flipped to MustHold by ADR 0022, which
\* added RootProbe to Fixes: no swap's error alone diverges a mount; the
\* read that follows shows the root pointer unchanged (ProbeUnchanged), and
\* the mount retries at its next commit.
\* CommitProtocol_NoRootProbe409 is this configuration without the member.
\* Route it showed before the flip: Mutate, PutSnapshot [2,1], SwapConflict
\* with the 409.
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
\*   RootProbe: ADR 0022 sections 1 to 4, the fix for #5
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence", "RootProbe"}
  Capability = "Conditional"
  Faults = {"SwapConflict409"}
  Start = "Loaded"
  Retention = 0
  MaxEpoch = 2
  Nonces = {1}
  MaxCrashes = 0
INVARIANTS
  TypeOK
  NoSelfDivergence
CHECK_DEADLOCK FALSE

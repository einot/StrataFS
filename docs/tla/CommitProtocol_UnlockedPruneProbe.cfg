\* CommitProtocol_UnlockedPruneProbe: MustHold.
\* CommitProtocol_PruneProbe with ADR 0023's two members: one writer pruning
\* at retention 1, with lost swap replies, failed swaps, snapshot Puts that
\* take effect and fail, failed probes and a crash, able to change its
\* namespace while its commit is in flight. ADR 0019 section 1's rule stands
\* with the store calls off the lock (ADR 0023 section 6): the swap conditions
\* on the ETag copied at the seal and names a key at the sealed epoch plus
\* one, the pass is begun by the apply of the swap that named its key, and an
\* adopted attempt is the key the root pointer already names; so the snapshot
\* the root pointer names is never deleted, and every property holds,
\* DirtyUntilCommitted included.
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
\*   PruneBelowCurrent: ADR 0019 section 2, the fix for #88
\*   AtomicLoad: ADR 0020 section 2, the fix for #89
\*   FallbackOptIn: ADR 0021 section 2, the fix for #91 (never reached, since
\*     the backend honours every conditional write)
\*   RootProbe: ADR 0022 sections 1 to 4, the fix for #5 and #103
\*   UnlockedCommit: ADR 0023 sections 1, 2 and 4, the fix for #43
\*   ClearIfUnchanged: ADR 0023 section 3, the guard #43's fix needs
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence", "PruneBelowCurrent", "AtomicLoad", "FallbackOptIn", "RootProbe", "UnlockedCommit", "ClearIfUnchanged"}
  Capability = "Conditional"
  Faults = {"SwapReplyLost", "SwapFailed", "SnapshotReplyLost", "ProbeFailed"}
  Start = "Empty"
  Retention = 1
  MaxEpoch = 3
  Nonces = {1, 2}
  MaxCrashes = 1
INVARIANTS
  TypeOK
  RootSnapshotExists
  NoLostAck
  ChunksBeforeRoot
  ReadOnlyNeverWrites
  NoSelfDivergence
  DirtyUntilCommitted
CHECK_DEADLOCK FALSE

\* CommitProtocol_NoRootProbe409: MustFail, NoSelfDivergence.
\* Removes RootProbe (ADR 0022) from CommitProtocol_SelfDiverge409: the
\* configuration that showed #5's 409 until ADR 0022 flipped it. A swap
\* answered 409 Conflict while its condition held, which errorFor maps to
\* store.ErrPrecondition, makes the mount diverge with no other writer
\* (Assumption J4).
\* Expected route: Mutate, PutSnapshot [2,1], SwapConflict with the 409.
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence"}
  Capability = "Conditional"
  Faults = {"SwapConflict409"}
  Start = "Loaded"
  Retention = 0
  MaxEpoch = 2
  Nonces = {1}
  MaxCrashes = 0
INVARIANTS
  TypeOK
  NoSelfDivergence
CHECK_DEADLOCK FALSE

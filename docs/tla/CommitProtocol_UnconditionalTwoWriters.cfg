\* CommitProtocol_UnconditionalTwoWriters: MustFail, NoLostAck.
\* Two writers that loaded one root pointer, on a backend with no conditional
\* writes, which answers every swap 501, without FallbackOptIn: what the
\* operator's opt-in gives up (ADR 0021 sections 1 and 4). Without the member
\* the configuration describes both commitLocked at 247a276 and two mounts
\* started with -allow-unconditional-root (Assumption J17): each writes the
\* root pointer unconditionally, so the second replaces the first's
\* acknowledged commit and neither notices. With the member it would hold,
\* since neither mount could commit at all, so it also removes the fix from
\* a configuration on a backend that never honours a condition, as ADR 0013
\* section 7 asks. Its bounds are CommitProtocol_Fallback's with Capability
\* Unconditional.
\* Expected route: A runs Mutate, PutSnapshot [2,1], SwapUnsupported, whose
\* fallback Put moves the root pointer, and FallbackHead, which acknowledges
\* A's epoch-2 commit; B runs Mutate, PutSnapshot [2,2] and SwapUnsupported,
\* whose fallback Put makes the root pointer name [2,2], and A's commit is no
\* longer in the root pointer's snapshot. TLC may report A's FallbackHead
\* after B's Put instead, at the same depth.
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A", "B"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence"}
  Capability = "Unconditional"
  Faults = {}
  Start = "Loaded"
  Retention = 0
  MaxEpoch = 2
  Nonces = {1, 2}
  MaxCrashes = 0
INVARIANTS
  TypeOK
  NoLostAck
CHECK_DEADLOCK FALSE

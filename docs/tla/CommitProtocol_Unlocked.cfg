\* CommitProtocol_Unlocked: MustHold.
\* One writer from an empty bucket with every swap fault (a lost reply, an
\* untyped failure, a 409 while the condition holds, a reply with no ETag),
\* snapshot Puts that fail whether or not they took effect, failed probes and
\* a crash, at CommitProtocol_ProbeFailed's bounds, with every fix the code
\* has and ADR 0023's two members: the commit's store calls run holding no
\* FS.mu, so a change can be made while a commit is in flight (Mutate at
\* "Swap", "Probe" or "FallbackHead"), and the commit's success clears the
\* dirty flag only if nothing changed since the seal. Every property holds,
\* DirtyUntilCommitted included: a change made during a flight leaves the
\* namespace dirty, the next commit carries it, and nothing acknowledged is
\* lost whatever the swap or the probe answered.
\* Fixes, and the source of each:
\*   IfNoneMatchInit: 247ef90, which introduced it; no ADR section decides it
\*   Nonce: ADR 0013 section 4 and Assumption 6 (in the code since 247ef90)
\*   ChunksFirst: ADR 0012 section 2 (in the code since 247ef90; 3deecf1
\*     changed flushAll)
\*   ReadOnlyFence: ADR 0011 section 3
\*   PruneBelowCurrent: ADR 0019 section 2, the fix for #88 (no pass runs
\*     here, since Retention is 0)
\*   AtomicLoad: ADR 0020 section 2, the fix for #89
\*   FallbackOptIn: ADR 0021 section 2, the fix for #91 (never reached, since
\*     the backend honours every conditional write)
\*   RootProbe: ADR 0022 sections 1 to 4, the fix for #5 and #103
\*   UnlockedCommit: ADR 0023 sections 1, 2 and 4, the fix for #43
\*   ClearIfUnchanged: ADR 0023 section 3, the guard #43's fix needs
SPECIFICATION Spec
CONSTANTS
  Mounts = {"A"}
  ReadOnlyMounts = {}
  Fixes = {"IfNoneMatchInit", "Nonce", "ChunksFirst", "ReadOnlyFence", "PruneBelowCurrent", "AtomicLoad", "FallbackOptIn", "RootProbe", "UnlockedCommit", "ClearIfUnchanged"}
  Capability = "Conditional"
  Faults = {"SwapReplyLost", "SwapFailed", "SwapConflict409", "SwapNoETag", "PutFailed", "SnapshotReplyLost", "ProbeFailed"}
  Start = "Empty"
  Retention = 0
  MaxEpoch = 3
  Nonces = {1, 2}
  MaxCrashes = 1
INVARIANTS
  TypeOK
  RootSnapshotExists
  NoLostAck
  ChunksBeforeRoot
  ReadOnlyNeverWrites
  NoSelfDivergence
  DirtyUntilCommitted
CHECK_DEADLOCK FALSE
